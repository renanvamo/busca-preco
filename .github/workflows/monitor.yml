name: Monitor de preços

on:
  schedule:
    - cron: "17 */2 * * *"      # a cada 2 horas, no minuto 17 (horário UTC)
  workflow_dispatch:             # botão "Run workflow" na aba Actions

# Uma execução por vez: se uma demorar, a próxima espera.
concurrency:
  group: monitor-precos
  cancel-in-progress: false

permissions:
  contents: write                # guardar o histórico na branch "data"
  pages: write                   # publicar a página
  id-token: write

env:
  TZ: America/Sao_Paulo          # horas nos avisos e na página em horário de Brasília
  PYTHONUTF8: "1"

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Baixar o histórico (branch data)
        run: |
          if git fetch --depth=1 origin data; then
            git show FETCH_HEAD:prices.db > prices.db
            echo "Histórico carregado: $(du -h prices.db | cut -f1)"
          else
            echo "Ainda não há histórico: começa do zero."
          fi

      - name: Rodar o monitor
        id: monitor
        continue-on-error: true       # mesmo se falhar, guarda o histórico e publica a página
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python price_watch.py run -v

      - name: Gerar a página
        run: python build_site.py

      - name: Guardar o histórico (branch data, sempre 1 commit só)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/estado"
          cp prices.db "$RUNNER_TEMP/estado/"
          cd "$RUNNER_TEMP/estado"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.db
          git commit -q -m "Histórico de preços $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar a página
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Falhar se o monitor falhou
        if: steps.monitor.outcome == 'failure'
        run: |
          echo "O monitor terminou com erro (veja o log do passo 'Rodar o monitor')."
          exit 1
